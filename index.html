<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flappy Plane</title>

<!-- PWA: ניתן להתקנה גם באנדרואיד וגם באייפון, ועובד גם בלי אינטרנט -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6b4423">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Plane">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tv">
    <div class="tv-frame">
      <div class="tv-bezel">
        <div id="game-wrap">
          <canvas id="bg-city" aria-hidden="true"></canvas>
          <canvas id="tower-images" aria-hidden="true"></canvas>
          <canvas id="game" width="400" height="600"></canvas>

          <div id="loading-screen" class="overlay">
            <p class="loading-text">טוען…</p>
          </div>

          <div id="start-screen" class="overlay">
            <img class="entrance-gif" src="design/raw/ENTRANCE.gif" alt="FLAPPY PLANE" fetchpriority="high">
            <p class="hint">קליק / רווח / נגיעה כדי להמריא</p>
            <button id="start-btn" class="main-btn">התחל משחק</button>
            <button id="install-btn" class="install-btn hidden">⬇ התקן אפליקציה</button>
            <p id="ios-install-hint" class="hint hidden">
              להתקנה על המסך הבית: הקש על כפתור השיתוף <span class="share-icon">⎋</span>
              ואז "הוסף למסך הבית"
            </p>
            <span id="build-marker" class="build-marker"></span>
          </div>

          <div id="gameover-screen" class="overlay hidden">
            <img class="pixel-logo pixel-logo-small" src="assets/headline.png" alt="FLAPPY PLANE">
            <h1>המטוס התרסק</h1>
            <p>ניקוד: <span id="final-score">0</span></p>
            <p>שיא: <span id="high-score">0</span></p>
            <button id="retry-btn" class="main-btn">נסה שוב</button>
          </div>

          <div id="hud" class="hidden">
            <span id="hud-score" class="pixel-text">SCORE: <span id="score">0</span></span>
          </div>

          <div id="screen-glare"></div>
          <div id="scanlines"></div>
        </div>
      </div>

      <div class="tv-controls">
        <button id="tv-start-btn" class="tv-physical-btn pixel-text" aria-label="התחל / נסה שוב">START</button>
        <div class="tv-vents">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <script src="version.js"></script>
  <script src="game.js"></script>
</body>
</html>
